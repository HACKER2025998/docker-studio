[package]
name = "dockforge"
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.88"
description = "Atelier Docker local, images et coffre chiffré"
license = "MIT"
authors = ["Kossi Bernard Etonam ADJOGBLE"]

[lib]
name = "dockforge_core"
path = "src/lib.rs"

[[bin]]
name = "dockforge"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-opener"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-util = { version = "0.7", features = ["io"] }
tokio = { version = "1", features = ["full"] }
bollard = { version = "0.19", features = ["buildkit"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
argon2 = "0.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
regex = "1"
tar = "0.4"
tempfile = "3"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
tauri = { package = "tauri", version = "2", optional = true , features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
