<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DockForge · ClassShare</title><style>body{font:16px system-ui;background:#f7f8fc;color:#14213d;max-width:760px;margin:60px auto;padding:24px}input,button{font:inherit;padding:12px;border:1px solid #ccd3df;border-radius:10px;margin:6px}button{background:#2563eb;color:white;cursor:pointer}li{padding:16px;background:white;margin:8px;border-radius:12px}a{color:#1749b8}#message{white-space:pre-wrap}</style></head><body><h1>ClassShare LAN</h1><p>Vérifiez l’empreinte du certificat auprès de l’hôte avant de rejoindre cette salle.</p><form id="join"><label>Votre nom <input id="name" required maxlength="80" autocomplete="nickname"></label><label>PIN <input id="pin" required pattern="[0-9]{6}" inputmode="numeric" maxlength="6" autocomplete="off"></label><button>Rejoindre</button></form><p id="message" role="status"></p><section id="room" hidden><button id="refresh">Actualiser</button><ul id="files"></ul><form id="upload" hidden><label>Contribution (64 Mio maximum)<input id="file" type="file" required></label><button>Envoyer</button></form></section><script src="/client.js" defer></script></body></html>
